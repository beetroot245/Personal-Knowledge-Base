name: Deploy knowledge base to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check content/notes.js
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets content _site/
          test -s _site/index.html
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
      - name: Verify artifact upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
